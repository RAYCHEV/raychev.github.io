<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV Viewer — Software Developer Portfolio</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href="../index.html">TheXcoder.com</a>
      <button
        class="navbar-toggler"
        type="button"
        data-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Live Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../discontinued/index.html">Discontinued</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </nav>

    <section id="csvviewer" class="container mt-5">
      <h1>CSV Viewer</h1>

      <div class="mb-4">
        <div class="form-group">
          <label for="csvFile">Upload CSV File</label>
          <input
            type="file"
            class="form-control-file"
            id="csvFile"
            accept=".csv"
          />
          <small class="form-text text-muted">
            Select a CSV file to view its contents in a table format
          </small>
        </div>

        <div id="csvActions" class="mt-3" hidden>
          <button type="button" class="btn btn-secondary mr-2" id="clearCsv">Clear</button>
          <button type="button" class="btn btn-primary" id="exportCsv">Export CSV</button>
        </div>
      </div>

      <div id="csvError" class="alert alert-danger" role="alert" hidden></div>

      <div id="csvTableWrap" class="table-responsive" hidden>
        <table class="table table-striped table-bordered table-hover">
          <thead class="thead-dark" id="csvHead"></thead>
          <tbody id="csvBody"></tbody>
        </table>
        <p class="text-muted mt-2" id="csvSummary"></p>
      </div>

      <div id="csvEmpty" class="alert alert-info" role="alert">
        Please upload a CSV file to get started. The CSV viewer will display your data in a formatted table.
      </div>
    </section>

    <script src="../script.js"></script>
    <script src="../js/csv-viewer.js"></script>
  </body>
</html>
