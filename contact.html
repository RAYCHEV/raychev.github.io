<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Software Developer Portfolio</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href="index.html">TheXcoder.com</a>
      <button
        class="navbar-toggler"
        type="button"
        data-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Live Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="discontinued/index.html">Discontinued</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </nav>

    <section id="contact" class="container mt-5">
      <h1>Contact</h1>
      <form id="contact-form" action="https://formspree.io/f/mjvnaryp" method="POST" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            autocomplete="email"
            maxlength="254"
            required
          />
          <div class="invalid-feedback" data-error-for="email"></div>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            class="form-control"
            id="message"
            name="message"
            rows="3"
            minlength="10"
            maxlength="5000"
            required
          ></textarea>
          <div class="invalid-feedback" data-error-for="message"></div>
        </div>
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display: none" />
        <button type="submit" class="btn btn-primary">Send</button>
        <p id="contact-status" class="mt-3" hidden></p>
      </form>
    </section>

    <script src="script.js"></script>
  </body>
</html>
